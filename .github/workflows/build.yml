name: build qca6490.ko

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Ветка или коммит ядра"
        default: "b9e789347b1bc1042a43090ca73462bb004a94f8"
      llvm_ver:
        description: "Мажорная версия LLVM"
        default: "22"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      LLVM: 1
      LLVM_IAS: 1

    steps:
      - name: Забрать патч из этого репозитория
        uses: actions/checkout@v4

      - name: Пакеты сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 rsync kmod cpio zstd wget gnupg lsb-release \
            software-properties-common gcc-aarch64-linux-gnu

      - name: LLVM/clang ${{ inputs.llvm_ver }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ inputs.llvm_ver }}
          # 5.10 не понимает LLVM=-NN, поэтому кладём безверсионные имена в PATH
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-strip llvm-ranlib; do
            sudo ln -sf /usr/bin/$t-${{ inputs.llvm_ver }} /usr/local/bin/$t
          done
          clang --version
          ld.lld --version

      - name: Клонировать ядро
        run: |
          # Короткий путь принципиален: при внешней сборке kbuild подставляет
          # АБСОЛЮТНЫЕ пути ко всем ~1000 объектам, и команда линковки уходит
          # в /bin/sh -c одним аргументом. Лимит на один аргумент — 128 КБ,
          # и с путём /home/runner/work/<repo>/<repo>/kernel мы его превышали.
          sudo mkdir -p /k && sudo chown "$USER" /k
          git clone --depth 1 --branch melt-rebase \
            https://github.com/Pzqqt/android_kernel_xiaomi_marble.git /k
          cd /k
          git fetch --depth 1 origin ${{ inputs.kernel_ref }} || true
          git checkout ${{ inputs.kernel_ref }} || echo "остаёмся на HEAD ветки"
          git log -1 --oneline

      - name: Наложить патч
        run: |
          cd /k
          git apply -v "$GITHUB_WORKSPACE/patches/0001-qcacld-monitor-mode-raw-tx.patch"
          git diff --stat

      - name: Конфигурация
        run: |
          cd /k
          make -j$(nproc) marble_defconfig
          # marble_defconfig не задаёт LTO -> Kconfig берёт LTO_NONE и следом
          # выбрасывает CFI. Работающее ядро собрано с LTO_CLANG_FULL и CFI_CLANG:
          # модуль без CFI в CFI-ядре падает на первом косвенном вызове.
          ./scripts/config --file .config \
            -d LTO_NONE -e LTO_CLANG_FULL -d LTO_CLANG_THIN \
            -e CFI_CLANG -e CFI_CLANG_SHADOW -d CFI_PERMISSIVE \
            -d HZ_250 -e HZ_300 --set-val HZ 300
          make -j$(nproc) olddefconfig

          # Собирать все 328 модулей незачем и вредно: часть downstream-драйверов
          # Qualcomm (slimbus, i2c-geni, cpuidle, clk-debug, dcvs, hyp_core_ctl)
          # не компилируется из-за TRACE_INCLUDE_PATH, а make после любой ошибки
          # не запускает стадию modpost — и не линкуется НИ ОДИН модуль, включая наш.
          # Оставляем только qcacld и его зависимости из depends= стокового модуля:
          #   cnss2, mi_cnss_statistic, cfg80211, cnss_prealloc, cnss_nl, cnss_utils
          KEEP="CONFIG_QCA_CLD_WLAN CONFIG_CNSS2 CONFIG_CNSS_UTILS CONFIG_CNSS_GENL \
                CONFIG_WCNSS_MEM_PRE_ALLOC CONFIG_MI_CNSS_STATISTIC CONFIG_CFG80211 \
                CONFIG_PCI_MSM"
          awk -v keep="$KEEP" '
            BEGIN { n = split(keep, a, /[ \t]+/); for (i = 1; i <= n; i++) k[a[i]] = 1 }
            /^CONFIG_[A-Z0-9_]+=m$/ {
              sym = $0; sub(/=m$/, "", sym)
              if (!(sym in k)) { print "# " sym " is not set"; next }
            }
            { print }
          ' .config > .config.trimmed && mv .config.trimmed .config
          make -j$(nproc) olddefconfig
          echo "модулей осталось: $(grep -c '=m$' .config)"

          echo "--- проверка критичных опций ---"
          fail=0
          for K in CONFIG_LTO_CLANG_FULL CONFIG_CFI_CLANG CONFIG_CFI_CLANG_SHADOW \
                   CONFIG_MODVERSIONS CONFIG_QCA_CLD_WLAN CONFIG_KASAN_HW_TAGS \
                   CONFIG_CNSS2 CONFIG_CNSS_UTILS CONFIG_CFG80211 CONFIG_PCI_MSM; do
            if grep -qE "^$K=" .config; then
              echo "  ok   $(grep -E "^$K=" .config)"
            else
              echo "  ОТСУТСТВУЕТ $K"; fail=1
            fi
          done
          grep -E "^CONFIG_HZ=" .config
          [ "$fail" = 0 ] || { echo "конфиг не сошёлся, дальше нет смысла"; exit 1; }

      - name: modules_prepare
        run: cd /k && make -j$(nproc) modules_prepare

      - name: Сборка qcacld внешним модулем
        run: |
          cd /k
          # Внутридеревенский `make modules` при MODVERSIONS тянет за собой vmlinux,
          # а на нём ломаются посторонние downstream-драйверы (techpack/camera,
          # pci-msm). Внешняя сборка (M=) vmlinux не требует: CRC modpost берёт
          # из Module.symvers, который мы собрали из 312 модулей самого устройства
          # (3565 символов, покрывают все 506 импортов стокового qca6490).
          cp "$GITHUB_WORKSPACE/Module.symvers.device" Module.symvers
          K=$PWD
          Q=$K/drivers/staging/qcacld-3.0
          make -j$(nproc) -C $K M=$Q modules \
            MODNAME=qca6490 \
            WLAN_ROOT=$Q \
            WLAN_COMMON_ROOT=cmn \
            WLAN_COMMON_INC=$Q/cmn \
            WLAN_FW_API=$Q/../fw-api/ \
            WLAN_PROFILE=qca6490 \
            CONFIG_QCA_CLD_WLAN=m
          find $Q -name '*.ko'

      - name: Собрать результат
        run: |
          cd /k
          mkdir -p out
          KO=$(find drivers/staging/qcacld-3.0 -name '*.ko' | head -1)
          [ -n "$KO" ] || { echo "модуль не собрался"; exit 1; }
          cp "$KO" out/
          cp .config out/build.config
          ls -la out
          echo "--- vermagic / name / depends ---"
          strings out/*.ko | grep -E '^vermagic=|^name=|^depends=' | head -3
          echo "--- символов в __versions ---"
          python3 - <<'PYEOF'
          import struct, glob
          f = glob.glob('out/*.ko')[0]
          d = open(f, 'rb').read()
          e_shoff, = struct.unpack_from('<Q', d, 0x28)
          shent, shnum, shstr = struct.unpack_from('<HHH', d, 0x3a)
          def sh(i):
              o = e_shoff + i*shent
              nm, = struct.unpack_from('<I', d, o)
              off, size = struct.unpack_from('<QQ', d, o+0x18)
              return nm, off, size
          _, stro, _ = sh(shstr)
          for i in range(shnum):
              nm, off, size = sh(i)
              end = d.index(b'\0', stro+nm)
              if d[stro+nm:end] == b'__versions':
                  print('записей:', size//64)
          PYEOF

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: qca6490-module
          path: /k/out/*
          retention-days: 30
