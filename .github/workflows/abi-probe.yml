name: ABI probe (cfg80211)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo дерева ядра"
        default: "Pzqqt/android_kernel_xiaomi_marble"
      branch:
        description: "ветка"
        default: "melt"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      LLVM: 1
      LLVM_IAS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex \
            libssl-dev libelf-dev python3 rsync kmod cpio zstd wget gnupg gcc-aarch64-linux-gnu
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 22
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                   llvm-readelf llvm-strip llvm-ranlib; do
            sudo ln -sf /usr/bin/$t-22 /usr/local/bin/$t
          done

      - name: Клон
        run: |
          sudo mkdir -p /k && sudo chown "$USER" /k
          git clone --depth 1 --branch "${{ inputs.branch }}" \
            "https://github.com/${{ inputs.repo }}.git" /k
          cd /k && git log -1 --oneline
          echo "--- версия драйвера в этом дереве ---"
          grep -m1 QWLAN_VERSIONSTR drivers/staging/qcacld-3.0/core/mac/inc/qwlan_version.h || echo "qcacld нет"

      - name: Конфиг + сборка net/wireless
        run: |
          cd /k
          make -j$(nproc) marble_defconfig
          ./scripts/config --file .config -m CFG80211 -e MODVERSIONS
          make -j$(nproc) olddefconfig
          grep -E "^CONFIG_(CFG80211|MODVERSIONS)=" .config
          make -j$(nproc) modules_prepare
          make -j$(nproc) KBUILD_MODULES=1 net/wireless/

      - name: Сверка CRC с устройством
        run: |
          cd /k
          python3 - <<'PY'
          import json, subprocess, glob, sys
          ref = json.load(open('$GITHUB_WORKSPACE/abi-reference.json'.replace('$GITHUB_WORKSPACE', __import__('os').environ['GITHUB_WORKSPACE'])))
          crcs = {}
          for o in glob.glob('net/wireless/*.o'):
              try:
                  out = subprocess.run(['llvm-nm', o], capture_output=True, text=True).stdout
              except Exception:
                  continue
              for line in out.splitlines():
                  p = line.split()
                  if len(p) >= 3 and p[-1].startswith('__crc_'):
                      crcs[p[-1][6:]] = int(p[0], 16) & 0xffffffff
          ok = bad = miss = 0
          print('%-34s %-12s %-12s' % ('СИМВОЛ', 'УСТРОЙСТВО', 'ЭТО ДЕРЕВО'))
          for k, v in sorted(ref.items()):
              got = crcs.get(k)
              if got is None:
                  print('%-34s 0x%08x   не найден' % (k, v)); miss += 1
              elif got == v:
                  print('%-34s 0x%08x   0x%08x  СОВПАЛ' % (k, v, got)); ok += 1
              else:
                  print('%-34s 0x%08x   0x%08x  РАСХОЖДЕНИЕ' % (k, v, got)); bad += 1
          print()
          print('совпало=%d расхождений=%d не найдено=%d' % (ok, bad, miss))
          print('ВЕРДИКТ:', 'ABI СОВМЕСТИМ' if bad == 0 and ok > 0 else 'ABI НЕ СОВПАДАЕТ')
          PY
